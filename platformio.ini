; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ------------------------------------------------------------------
; SWITCHING BETWEEN BOARD USB AND ESP-PROG
;
; This is PlatformIO environment selection, not switching Git branches.
; See README.md for complete clean, build, upload, and monitor workflows.
; Repeat -e for every command in a CLI chain; it does not carry forward.
;
; WHY:
;   esp32dev: use board USB for routine firmware uploads and serial logs.
;   esp32-jtag: use ESP-Prog JTAG for uploads and hardware debugging
;     (breakpoints, single-stepping, and inspecting variables).
;   Selecting an environment changes tool configuration, not PCB wiring.
;
; SWITCH TO ESP-PROG:
;   1. Stop debugging/monitoring and power down before changing wiring.
;   2. Connect ESP-Prog USB and the correctly oriented JTAG ribbon.
;      Follow the board/probe wiring and power requirements; avoid
;      conflicting power sources. For this project's classic ESP32
;      JTAG setup, GPIO 12-15 must be free of external loads.
;   3. Select esp32-jtag in the PlatformIO environment selector, or use
;      Project Tasks > esp32-jtag for that environment's tasks.
;   4. Upload: pio run -e esp32-jtag -t upload
;      Debug:  pio debug -e esp32-jtag
;      In VS Code, start the PlatformIO debug configuration for this env.
;   5. Serial logs through ESP-Prog require its UART interface to be
;      wired to the board; the JTAG ribbon alone does not carry UART logs.
;      Monitor: pio device monitor -e esp32-jtag
;
; SWITCH BACK TO BOARD USB:
;   1. Stop debugging/monitoring and power down before changing wiring.
;   2. Disconnect the JTAG ribbon if its pins are needed by peripherals,
;      restore normal wiring, and connect the board's USB serial interface.
;   3. Select esp32dev in PlatformIO, or use Project Tasks > esp32dev.
;   4. Upload:  pio run -e esp32dev -t upload
;      Monitor: pio device monitor -e esp32dev
;
; PORTS AND DEFAULTS:
;   Run pio device list and update [ports] for your computer/connections.
;   ESP-Prog JTAG uses its USB debug interface, not a UART serial path;
;   probe_serial identifies the serial-monitor interface in this setup.
;   The -e CLI option selects an environment for that command only.
;   To change the default for commands without -e, set default_envs below
;   to esp32-jtag or esp32dev. No Config.hpp changes are required.
; ------------------------------------------------------------------

[platformio]
; Used when you run plain `pio run` / press toolbar buttons
; with no env explicitly selected:
default_envs = esp32dev

; MACHINE-SPECIFIC SERIAL PORTS
; These paths belong to the development computer, not the ESP32 firmware.
; The values below are from the original macOS setup and may not match
; another laptop, operating system, USB adapter, or USB connection.
; Run `pio device list` on your computer and update both values to match
; the corresponding serial devices. Re-check after changing connections.
; No changes to Config.hpp are needed.
[ports]
board_serial = /dev/cu.usbserial-1410
probe_serial = /dev/cu.usbserial-14101

; DEBUG SOURCE-PATH MAPPINGS
; Build paths identify source locations recorded in library debug info;
; they are NOT directories that must exist on your laptop.
; Local paths must point to matching source directories on your computer.
; The defaults below preserve the existing mappings; verify they exist.
; If your PlatformIO installation is elsewhere, edit the local paths here.
; If library debug info changes, the corresponding build paths may also
; need updating. These mappings do not download missing source files.
[debug_paths]
newlib_build = /builds/idf/crosstool-NG/.build/HOST-x86_64-apple-darwin12/xtensa-esp32-elf/src/newlib/newlib
newlib_local = $HOME/.platformio/packages/newlib-esp32/newlib
framework_build = /home/runner/work/esp32-arduino-lib-builder/esp32-arduino-lib-builder
framework_local = $HOME/.platformio/packages/esp-idf

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = ${ports.board_serial}

; Build flags for WiFi and JTAG
build_flags =
    -D WIFI_SSID='${sysenv.WIFI_SSID}'
    -D WIFI_PASS='${sysenv.WIFI_PASS}'
    -DCORE_DEBUG_LEVEL=5

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup
debug_speed = 1000
debug_build_flags = -O0 -ggdb3 -g3
debug_extra_cmds =
    set substitute-path "${debug_paths.newlib_build}" "${debug_paths.newlib_local}"
    set substitute-path "${debug_paths.framework_build}" "${debug_paths.framework_local}"

upload_protocol = esptool
upload_speed = 921600
upload_port = ${ports.board_serial}

; ------------------------------------------------------------------
; esp-prog env: everything above is inherited; only the transport
; changes. Use when the ribbon is connected and you want GDB.
; ------------------------------------------------------------------
[env:esp32-jtag]
extends = env:esp32dev

upload_protocol = esp-prog
upload_port = ${ports.probe_serial}
monitor_port = ${ports.probe_serial}