; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ------------------------------------------------------------------
; HOW TO SWITCH ENVIRONMENTS
;
;   VS Code: click the environment pill in the bottom status bar
;     (left of the PlatformIO tick/arrow/plug icons, currently shows
;     "esp32dev"). Pick esp32dev or esp32-jtag there; the build,
;     upload and monitor buttons then act on the selected env.
;
;   CLI:
;     pio run -e esp32dev -t upload       ; flash via board USB
;     pio device monitor -e esp32dev      ; serial console (works)
;     pio run -e esp32-jtag -t upload     ; flash via esp-prog
;     pio debug -e esp32-jtag             ; GDB session
;
;   After any physical swap, re-check ports:  ls /dev/cu.usb*
;   macOS renames them by socket/hub slot (the probe was
;   -141400/-141401 earlier, -14100/-14101 now).
; ------------------------------------------------------------------

[platformio]
; Used when you run plain `pio run` / press toolbar buttons
; with no env explicitly selected:
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-1410

; Build flags for WiFi and JTAG
build_flags = 
    -D WIFI_SSID='${sysenv.WIFI_SSID}' 
    -D WIFI_PASS='${sysenv.WIFI_PASS}' 
    -DCORE_DEBUG_LEVEL=5

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup
debug_speed = 1000
debug_build_flags = -O0 -ggdb3 -g3
debug_extra_cmds =
    set substitute-path /builds/idf/crosstool-NG/.build/HOST-x86_64-apple-darwin12/xtensa-esp32-elf/src/newlib/newlib $HOME/.platformio/packages/newlib-esp32/newlib
    set substitute-path /home/runner/work/esp32-arduino-lib-builder/esp32-arduino-lib-builder $HOME/.platformio/packages/esp-idf

upload_protocol = esptool
upload_speed = 921600
upload_port = /dev/cu.usbserial-1410

; ------------------------------------------------------------------
; esp-prog env: everything above is inherited; only the transport
; changes. Use when the ribbon is connected and you want GDB.
; ------------------------------------------------------------------
[env:esp32-jtag]
extends = env:esp32dev

upload_protocol = esp-prog
upload_port = /dev/cu.usbserial-14101
monitor_port = /dev/cu.usbserial-14101